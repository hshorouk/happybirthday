<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Momo 🎈</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/Q3JCG2hS/Chat-GPT-Image-Sep-17-2026-07-57-18-PM-removebg-preview.png">    
<link rel="stylesheet" href="style.css">
<style>
.heart-loader {
    position: fixed;
    inset: 0;
    z-index: 99999999999999998 !important;
    pointer-events: none;
    overflow: hidden;
}

.loader-heart {
    position: absolute;

    left: 50%;
    top: 57%;

    color: #e6002d;
    font-weight: normal;

    opacity: 0;

    filter: drop-shadow(0 2px 5px rgba(230, 0, 45, 0.18));

    will-change: transform, opacity;

    animation: smoothHeart 3.2s cubic-bezier(.22, .61, .36, 1) forwards;
}


/* حركة القلوب */
@keyframes smoothHeart {

    0% {
        opacity: 0;
        transform:
            translate3d(
                calc(-50% + var(--start-x)),
                calc(-50% + var(--start-y)),
                0
            )
            scale(0.35)
            rotate(0deg);
    }

    12% {
        opacity: 0.95;
    }

    35% {
        opacity: 1;
    }

    70% {
        opacity: 0.8;
    }

    100% {
        opacity: 0;

        transform:
            translate3d(
                calc(-50% + var(--end-x)),
                calc(-50% + var(--end-y)),
                0
            )
            scale(var(--scale))
            rotate(var(--rotate));
    }
}
body:before {
    content: "";
    width: 100%;
    height: 100%;

    background: #ffffff82 url(https://i.ibb.co/Q3JCG2hS/Chat-GPT-Image-Sep-17-2026-07-57-18-PM-removebg-preview.png);
    backdrop-filter: blur(60px);

    position: fixed;
    inset: 0;

    z-index: 99999999999999999 !important;

    background-size: 250px !important;
    background-repeat: no-repeat;
    background-position: center !important;

    animation: logobg 3s cubic-bezier(.22, .61, .36, 1) forwards;
}


@keyframes logobg {

    0% {
        opacity: 1;
        transform: scale(1);
    }

    75% {
        opacity: 1;
        transform: scale(1);
    }

    100% {
        opacity: 0;
        transform: scale(.1);
    }
}
  .hero{
    min-height: 78vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 20px 10px 60px;
  }
  .sticker-row{ font-size: 34px; margin-bottom: 18px; letter-spacing: 10px; }
  .hero h1{ font-size: clamp(46px, 10vw, 88px); color: var(--red); line-height:1.1; }
  .hero h1 .accent{ color: var(--gold); }
  .hero .sub{ margin-top: 20px; font-size: 18px; color: var(--plum-soft); max-width: 440px; line-height:1.8; }
  .countdown{ margin-top: 42px; display:flex; gap: 14px; flex-wrap:wrap; justify-content:center; }
  .count-box{ background: var(--white); border-radius: 20px; padding: 16px 20px; min-width: 78px; box-shadow: 0 10px 26px rgba(75,58,107,0.1); }
  .count-box .num{ font-family:'Baloo 2', sans-serif; font-size: 30px; font-weight:700; color: var(--red); }
  .count-box .lbl{ font-size: 12px; color: var(--plum-soft); margin-top: 2px; }
  .explore-btn{ margin-top: 46px; }
</style>
</head>
<body>

<div class="blob" style="width:340px;height:340px;top:-100px;left:-100px;background:var(--blush);"></div>
<div class="blob" style="width:280px;height:280px;bottom:-80px;right:-80px;background:var(--gold-soft);"></div>
<div class="blob" style="width:200px;height:200px;top:35%;right:-60px;background:var(--gold);opacity:0.3;"></div>

<div class="nav-wrap">
  <nav>
    <a href="index.html" class="active">home</a>
    <a href="story.html">our story</a>
    <a href="gallery.html">gallery</a>
    <a href="love.html">for you</a>
    <a href="surprise.html">surprise</a>
  </nav>
</div>

<main>
  <section class="hero reveal">
    <div class="sticker-row">🎂 ✨ 🎈</div>
    <h1>Happy Birthday<br><span class="accent">Momo!</span></h1>
    <p class="sub">My favorite person in the whole world turns another year older today. I'm the luckiest girl alive 🤍</p>

    <div class="countdown" id="countdown">
      <div class="count-box"><div class="num" id="cd-days">--</div><div class="lbl">days</div></div>
      <div class="count-box"><div class="num" id="cd-hours">--</div><div class="lbl">hrs</div></div>
      <div class="count-box"><div class="num" id="cd-mins">--</div><div class="lbl">min</div></div>
      <div class="count-box"><div class="num" id="cd-secs">--</div><div class="lbl">sec</div></div>
    </div>

    <div class="explore-btn">
      <a href="story.html"><button class="pill-btn">see our story →</button></a>
    </div>
  </section>
</main>

<footer class="reveal">
  <div class="foot-display">made with love, just for you 💌</div>
  <div>your wife who loves you more than anything</div>
</footer>

<script>
  function nextBirthday(){
    const now = new Date();
    let year = now.getFullYear();
    let target = new Date(year, 8, 18, 0, 0, 0);
    if(target < now){ target = new Date(year + 1, 8, 18, 0, 0, 0); }
    return target;
  }
  function updateCountdown(){
    const diff = Math.max(0, nextBirthday() - new Date());
    document.getElementById('cd-days').textContent = Math.floor(diff / 86400000);
    document.getElementById('cd-hours').textContent = String(Math.floor(diff / 3600000) % 24).padStart(2,'0');
    document.getElementById('cd-mins').textContent = String(Math.floor(diff / 60000) % 60).padStart(2,'0');
    document.getElementById('cd-secs').textContent = String(Math.floor(diff / 1000) % 60).padStart(2,'0');
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);

  /* fade-in on scroll */
  const revealEls = document.querySelectorAll('.reveal, .reveal-stagger');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  revealEls.forEach(el => io.observe(el));


document.addEventListener("DOMContentLoaded", function () {

    const container = document.createElement("div");
    container.className = "heart-loader";

    document.body.appendChild(container);

    const heartCount = 24;

    for (let i = 0; i < heartCount; i++) {

        const heart = document.createElement("span");

        heart.className = "loader-heart";
        heart.innerHTML = "♥";

        /*
         * بداية القلوب:
         * قريبة من الصورة وليس من الشاشة كلها
         */
        const startX = (Math.random() - 0.5) * 130;
        const startY = (Math.random() - 0.5) * 55;

        /*
         * اتجاه الحركة
         * معظم القلوب تطلع لفوق
         */
        const endX = (Math.random() - 0.5) * 330;
        const endY = -(160 + Math.random() * 230);

        /*
         * أحجام مختلفة لكن مش ضخمة
         */
        const scale = 0.75 + Math.random() * 0.8;

        /*
         * دوران بسيط
         */
        const rotate = -20 + Math.random() * 40;

        /*
         * حجم القلب
         */
        const size = 13 + Math.random() * 13;

        heart.style.fontSize = size + "px";

        heart.style.setProperty("--start-x", startX + "px");
        heart.style.setProperty("--start-y", startY + "px");

        heart.style.setProperty("--end-x", endX + "px");
        heart.style.setProperty("--end-y", endY + "px");

        heart.style.setProperty("--scale", scale);
        heart.style.setProperty("--rotate", rotate + "deg");

        /*
         * ظهور القلوب تدريجيًا
         */
        heart.style.animationDelay =
            (i * 0.07 + Math.random() * 0.4) + "s";

        container.appendChild(heart);
    }


    /*
     * حذف القلوب بعد انتهاء الأنيميشن
     */
    setTimeout(function () {
        container.remove();
    }, 4500);

});
</script>

</body>
</html>
